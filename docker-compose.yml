# Start with: docker compose up --build
# Secrets come from the .env file next to this file. See .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Administrator account, used only to create the application's user below.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      APP_DB_NAME: opstrack
      APP_DB_USER: ${DB_USERNAME:-opstrack}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    # No "ports" section: PostgreSQL is reachable only from this Compose network.
    networks:
      - backend
    healthcheck:
      # TCP, not the local socket: the first-start setup server listens only on
      # the socket, so this stays unhealthy until setup has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d opstrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    # Wait until the database accepts connections, not just until it has started.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/opstrack
      DB_USERNAME: ${DB_USERNAME:-opstrack}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OPSTRACK_API_KEY: ${OPSTRACK_API_KEY:?Set OPSTRACK_API_KEY in .env}
      OPSTRACK_RATE_LIMIT_PER_MINUTE: ${OPSTRACK_RATE_LIMIT_PER_MINUTE:-60}
    # Published on this computer only. Production needs an HTTPS proxy in front.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  # Named volume: data survives when containers are removed.
  postgres-data:

networks:
  backend:
